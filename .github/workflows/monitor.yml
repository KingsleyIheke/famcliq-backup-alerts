name: Check backup and send one failure alert
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      test_failure:
        description: Send the authorised test once, repeat to check deduplication
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: backup-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Read private backup health only
        continue-on-error: true
        env:
          READ_KEY: ${{ secrets.BACKUP_READ_SSH_KEY }}
          BACKUP_REPOSITORY: ${{ secrets.BACKUP_REPOSITORY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$READ_KEY" > ~/.ssh/backup_read
          chmod 600 ~/.ssh/backup_read
          curl --fail --silent https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          GIT_SSH_COMMAND='ssh -i ~/.ssh/backup_read -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' git clone --depth=1 --filter=blob:none --sparse --no-checkout "git@github.com:$BACKUP_REPOSITORY.git" private-backup
          git -C private-backup sparse-checkout set --no-cone /health.json
          GIT_SSH_COMMAND='ssh -i ~/.ssh/backup_read -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' git -C private-backup checkout
      - name: Check freshness and alert once
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          TEST_FAILURE: ${{ inputs.test_failure == true && 'true' || 'false' }}
        run: node monitor.mjs
      - name: Save alert status and daily heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Backup health monitor'
          git config user.email 'backup-monitor@users.noreply.github.com'
          gh auth setup-git
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Backup health check"
            git push origin HEAD:monitor
          fi
